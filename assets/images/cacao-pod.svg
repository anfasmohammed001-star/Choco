<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="100%" height="100%">
  <defs>
    <linearGradient id="podGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347" />
      <stop offset="25%" stop-color="#cc6600" />
      <stop offset="60%" stop-color="#802b00" />
      <stop offset="90%" stop-color="#4d1a00" />
      <stop offset="100%" stop-color="#2d1003" />
    </linearGradient>
    <linearGradient id="ribHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe099" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff9933" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#662200" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3728" />
      <stop offset="100%" stop-color="#211812" />
    </linearGradient>
    <filter id="podShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="12" dy="20" stdDeviation="16" flood-color="#0a0503" flood-opacity="0.6" />
    </filter>
  </defs>

  <g transform="rotate(35 225 225)" filter="url(#podShadow)">
    <!-- Wooden Stem -->
    <path d="M 220 50 C 220 30, 230 20, 245 15 C 255 15, 250 35, 240 55 Z" fill="url(#stemGrad)" />

    <!-- Main Cacao Pod Shell Contour -->
    <path d="M 225 55 
             C 320 80, 360 170, 350 260 
             C 340 340, 280 400, 225 435 
             C 170 400, 110 340, 100 260 
             C 90 170, 130 80, 225 55 Z" 
          fill="url(#podGradient)" stroke="#521d05" stroke-width="2" />

    <!-- Longitudinal Ridges/Ribs Characteristic of Cacao Pod -->
    <!-- Ridge 1 (Center) -->
    <path d="M 225 55 C 235 150, 235 320, 225 435" stroke="url(#ribHighlight)" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 228 55 C 238 150, 238 320, 228 435" stroke="#331100" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Ridge 2 (Right Inner) -->
    <path d="M 225 55 C 285 140, 295 300, 225 435" stroke="url(#ribHighlight)" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 230 55 C 290 140, 300 300, 230 435" stroke="#331100" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Ridge 3 (Right Outer) -->
    <path d="M 225 55 C 330 150, 335 280, 225 435" stroke="url(#ribHighlight)" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Ridge 4 (Left Inner) -->
    <path d="M 225 55 C 165 140, 155 300, 225 435" stroke="url(#ribHighlight)" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 160 140 C 150 250, 180 350, 225 435" stroke="#210a00" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Ridge 5 (Left Outer) -->
    <path d="M 225 55 C 120 150, 115 280, 225 435" stroke="url(#ribHighlight)" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Warty / Textured bumps on shell -->
    <ellipse cx="205" cy="170" rx="8" ry="5" fill="#ffd175" opacity="0.6" />
    <ellipse cx="245" cy="220" rx="9" ry="6" fill="#ffd175" opacity="0.6" />
    <ellipse cx="185" cy="270" rx="7" ry="4" fill="#ffd175" opacity="0.5" />
    <ellipse cx="265" cy="160" rx="8" ry="5" fill="#ffb84d" opacity="0.7" />
    <ellipse cx="220" cy="340" rx="6" ry="4" fill="#ffd175" opacity="0.6" />
    <ellipse cx="270" cy="290" rx="7" ry="5" fill="#cc6600" opacity="0.6" />
  </g>
</svg>

