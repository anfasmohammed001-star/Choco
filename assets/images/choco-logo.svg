<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd280" />
      <stop offset="50%" stop-color="#d48b46" />
      <stop offset="100%" stop-color="#a65d1c" />
    </linearGradient>
    <linearGradient id="beanShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Stylized Cacao Bean Emblem -->
  <g transform="translate(10, 8)">
    <path d="M 22 4 C 36 10, 44 26, 38 38 C 32 46, 16 46, 8 36 C 0 24, 6 10, 22 4 Z" fill="url(#logoGold)" />
    <!-- Bean center groove -->
    <path d="M 22 8 Q 28 22 18 36" stroke="#2b1509" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <!-- Specular highlight -->
    <path d="M 14 12 C 16 9, 22 7, 26 8" stroke="url(#beanShine)" stroke-width="1.8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography "choco." -->
  <text x="65" y="40" font-family="'Bodoni Moda', 'Playfair Display', Georgia, serif" font-size="36" font-weight="800" letter-spacing="-0.5" fill="#fdfbf7">
    choco<tspan fill="#d48b46">.</tspan>
  </text>
</svg>

