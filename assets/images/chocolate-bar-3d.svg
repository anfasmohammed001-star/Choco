<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep chocolate gradients -->
    <linearGradient id="chocSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e2e1c" />
      <stop offset="40%" stop-color="#361c10" />
      <stop offset="100%" stop-color="#210e06" />
    </linearGradient>
    <linearGradient id="squareBevelTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73472b" />
      <stop offset="100%" stop-color="#3d2112" />
    </linearGradient>
    <linearGradient id="squareBevelBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241108" />
      <stop offset="100%" stop-color="#140803" />
    </linearGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#e8be6b" />
      <stop offset="25%" stop-color="#fff4d0" />
      <stop offset="50%" stop-color="#cf9c3e" />
      <stop offset="75%" stop-color="#9a6e23" />
      <stop offset="100%" stop-color="#f5d78a" />
    </linearGradient>
    <linearGradient id="goldFoilFold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#805b18" />
      <stop offset="100%" stop-color="#5a3d0c" />
    </linearGradient>
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="15" dy="25" stdDeviation="18" flood-color="#0a0503" flood-opacity="0.65" />
    </filter>
    <filter id="squareShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0d0502" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind -->
  <circle cx="250" cy="250" r="180" fill="#d48b46" opacity="0.12" filter="blur(30px)" />

  <g transform="rotate(-8 250 250)" filter="url(#softShadow)">
    <!-- Golden Foil Wrapper Backing / Peeling -->
    <path d="M 120 70 L 370 40 L 395 380 L 150 420 Z" fill="url(#goldFoil)" />
    <!-- Crinkles and facets on foil -->
    <path d="M 120 70 L 200 130 L 150 180 L 125 120 Z" fill="url(#goldFoilFold)" opacity="0.3" />
    <path d="M 370 40 L 340 120 L 390 160 Z" fill="url(#goldFoilFold)" opacity="0.25" />
    <path d="M 395 380 L 330 350 L 360 410 Z" fill="url(#goldFoilFold)" opacity="0.35" />
    <path d="M 150 420 L 210 390 L 170 360 Z" fill="url(#goldFoilFold)" opacity="0.4" />

    <!-- Chocolate Bar Slab Base -->
    <rect x="135" y="80" width="230" height="300" rx="12" fill="url(#chocSurface)" stroke="#683d21" stroke-width="2" />

    <!-- 6 Chocolate Squares (2 columns x 3 rows) -->
    <!-- Row 1 -->
    <g transform="translate(150, 95)" filter="url(#squareShadow)">
      <rect x="0" y="0" width="95" height="80" rx="6" fill="url(#squareBevelTop)" />
      <rect x="5" y="5" width="85" height="70" rx="4" fill="#361c10" stroke="#1f0f07" stroke-width="1.5" />
      <text x="47" y="45" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" letter-spacing="2" fill="#5c341b" text-anchor="middle">CHOCO</text>
      <!-- Gloss line -->
      <path d="M 5 5 L 85 5 L 80 15 L 10 15 Z" fill="url(#glossHighlight)" />
    </g>

    <g transform="translate(255, 95)" filter="url(#squareShadow)">
      <rect x="0" y="0" width="95" height="80" rx="6" fill="url(#squareBevelTop)" />
      <rect x="5" y="5" width="85" height="70" rx="4" fill="#361c10" stroke="#1f0f07" stroke-width="1.5" />
      <text x="47" y="45" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" letter-spacing="2" fill="#5c341b" text-anchor="middle">70%</text>
      <path d="M 5 5 L 85 5 L 80 15 L 10 15 Z" fill="url(#glossHighlight)" />
    </g>

    <!-- Row 2 -->
    <g transform="translate(150, 185)" filter="url(#squareShadow)">
      <rect x="0" y="0" width="95" height="80" rx="6" fill="url(#squareBevelTop)" />
      <rect x="5" y="5" width="85" height="70" rx="4" fill="#361c10" stroke="#1f0f07" stroke-width="1.5" />
      <text x="47" y="45" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" letter-spacing="2" fill="#5c341b" text-anchor="middle">CRIOLLO</text>
      <path d="M 5 5 L 85 5 L 80 15 L 10 15 Z" fill="url(#glossHighlight)" />
    </g>

    <g transform="translate(255, 185)" filter="url(#squareShadow)">
      <rect x="0" y="0" width="95" height="80" rx="6" fill="url(#squareBevelTop)" />
      <rect x="5" y="5" width="85" height="70" rx="4" fill="#361c10" stroke="#1f0f07" stroke-width="1.5" />
      <text x="47" y="45" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" letter-spacing="2" fill="#5c341b" text-anchor="middle">CHOCO</text>
      <path d="M 5 5 L 85 5 L 80 15 L 10 15 Z" fill="url(#glossHighlight)" />
    </g>

    <!-- Row 3 (partially exposed under peeled foil) -->
    <g transform="translate(150, 275)" filter="url(#squareShadow)">
      <rect x="0" y="0" width="95" height="80" rx="6" fill="url(#squareBevelTop)" />
      <rect x="5" y="5" width="85" height="70" rx="4" fill="#361c10" stroke="#1f0f07" stroke-width="1.5" />
      <text x="47" y="45" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" letter-spacing="2" fill="#5c341b" text-anchor="middle">PURE</text>
    </g>

    <g transform="translate(255, 275)" filter="url(#squareShadow)">
      <rect x="0" y="0" width="95" height="80" rx="6" fill="url(#squareBevelTop)" />
      <rect x="5" y="5" width="85" height="70" rx="4" fill="#361c10" stroke="#1f0f07" stroke-width="1.5" />
      <text x="47" y="45" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" letter-spacing="2" fill="#5c341b" text-anchor="middle">ORIGIN</text>
    </g>

    <!-- Wrapped Foil Bottom Portion with folded paper band -->
    <path d="M 125 240 Q 250 280 375 245 L 380 405 L 125 405 Z" fill="url(#goldFoil)" />
    <!-- Outer Paper Wrap band -->
    <path d="M 125 270 Q 250 300 378 275 L 380 390 L 125 390 Z" fill="#1b120c" stroke="#cf9c3e" stroke-width="1" />
    <text x="250" y="335" font-family="'Bodoni Moda', serif" font-size="22" font-weight="800" letter-spacing="4" fill="#e8decb" text-anchor="middle">CHOCO</text>
    <text x="250" y="355" font-family="'Inter', sans-serif" font-size="9" letter-spacing="3" fill="#cf9c3e" text-anchor="middle">SINGLE ORIGIN • 72H CONCHE</text>

    <!-- Diagonal Gloss Sheen -->
    <path d="M 135 80 L 220 80 L 370 380 L 285 380 Z" fill="url(#glossHighlight)" pointer-events="none" />
  </g>
</svg>

