<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="truffleBody" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#5a331c" />
      <stop offset="35%" stop-color="#3c1e0e" />
      <stop offset="70%" stop-color="#231006" />
      <stop offset="100%" stop-color="#120602" />
    </radialGradient>
    <radialGradient id="truffleHighlight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="drizzle" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#693c20" />
      <stop offset="50%" stop-color="#462210" />
      <stop offset="100%" stop-color="#261005" />
    </linearGradient>
    <filter id="truffleShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="18" stdDeviation="15" flood-color="#0a0503" flood-opacity="0.7" />
    </filter>
    <filter id="cocoaDust" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.45   0 0 0 0 0.25   0 0 0 0 0.12  0 0 0 0.25 0" />
      <feComposite in2="SourceGraphic" in="gl" operator="in" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="210" r="140" fill="#d48b46" opacity="0.1" filter="blur(25px)" />

  <g filter="url(#truffleShadow)">
    <!-- Base Organic Spherical Truffle -->
    <path d="M 200 80 C 275 75, 320 120, 325 195 C 330 270, 275 320, 195 325 C 120 330, 75 275, 75 195 C 75 125, 125 85, 200 80 Z" 
          fill="url(#truffleBody)" />
    
    <!-- Organic cocoa powder ripples -->
    <path d="M 120 130 Q 200 110 280 150 Q 230 220 140 200 Z" fill="#2b1409" opacity="0.4" />
    <path d="M 160 210 Q 240 180 300 240 Q 220 310 130 270 Z" fill="#1f0c04" opacity="0.4" />

    <!-- Glossy Ganache Drizzle Swirls -->
    <path d="M 105 165 C 130 140, 185 125, 220 145 C 265 170, 290 140, 310 160" 
          stroke="url(#drizzle)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 90 200 C 130 180, 190 200, 240 180 C 280 165, 310 215, 315 230" 
          stroke="url(#drizzle)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 115 240 C 150 225, 205 245, 260 220 C 285 210, 295 250, 290 270" 
          stroke="url(#drizzle)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Drizzle Highlights -->
    <path d="M 115 160 C 140 138, 185 125, 215 142" 
          stroke="#824c29" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 100 196 C 135 178, 190 197, 235 178" 
          stroke="#824c29" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Flakes of 24k Edible Gold Leaf on Top -->
    <polygon points="190,110 205,102 215,115 200,122" fill="url(#goldLeaf)" />
    <polygon points="212,118 225,112 230,126 218,128" fill="url(#goldLeaf)" />
    <polygon points="182,125 192,120 190,132 180,130" fill="url(#goldLeaf)" opacity="0.9" />
    <polygon points="202,96 210,92 212,100" fill="#fff4d0" />
    <!-- Fine gold dust specks -->
    <circle cx="175" cy="115" r="2" fill="#d4af37" />
    <circle cx="235" cy="130" r="1.5" fill="#ffe699" />
    <circle cx="195" cy="138" r="2.5" fill="#d4af37" />
    <circle cx="215" cy="142" r="1.8" fill="#ffe699" />
    <circle cx="245" cy="110" r="1.5" fill="#d4af37" />

    <!-- High-gloss light curvature highlight -->
    <ellipse cx="160" cy="140" rx="55" ry="38" transform="rotate(-25 160 140)" fill="url(#truffleHighlight)" />
  </g>
</svg>

