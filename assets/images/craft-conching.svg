<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="liquidChocolatePool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a2512" />
      <stop offset="50%" stop-color="#331609" />
      <stop offset="100%" stop-color="#1b0a04" />
    </radialGradient>
    <linearGradient id="graniteStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#696562" />
      <stop offset="50%" stop-color="#45423f" />
      <stop offset="100%" stop-color="#2b2826" />
    </linearGradient>
    <linearGradient id="liquidGloss" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#140b07" rx="16" />

  <!-- Molten Chocolate Conching Basin -->
  <ellipse cx="300" cy="220" rx="240" ry="120" fill="url(#liquidChocolatePool)" stroke="#663314" stroke-width="4" />

  <!-- Liquid Conching Swirl Waves -->
  <path d="M 120 220 C 180 180, 240 260, 320 210 C 390 170, 440 240, 480 220" 
        stroke="#592b13" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 160 240 C 220 210, 280 270, 360 225 C 410 195, 450 240, 470 230" 
        stroke="#6e371a" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 170 236 C 225 208, 280 268, 355 223" 
        stroke="#ffd199" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Heavy Granite Stone Roller Wheel 1 -->
  <g transform="translate(180, 110)">
    <ellipse cx="50" cy="80" rx="45" ry="75" fill="url(#graniteStone)" stroke="#8c8784" stroke-width="2" />
    <!-- Chiseled granite lines -->
    <path d="M 25 35 Q 50 80 25 125" stroke="#383634" stroke-width="2" fill="none" />
    <path d="M 50 15 Q 75 80 50 145" stroke="#999491" stroke-width="1.5" fill="none" />
    <ellipse cx="50" cy="80" rx="15" ry="25" fill="#1f1d1c" />
    <!-- Chocolate coating splash on lower wheel -->
    <path d="M 15 110 C 30 145, 70 145, 85 110 C 70 155, 30 155, 15 110 Z" fill="#3a1c0d" />
  </g>

  <!-- Heavy Granite Stone Roller Wheel 2 -->
  <g transform="translate(320, 100)">
    <ellipse cx="50" cy="80" rx="45" ry="75" fill="url(#graniteStone)" stroke="#8c8784" stroke-width="2" />
    <path d="M 25 35 Q 50 80 25 125" stroke="#383634" stroke-width="2" fill="none" />
    <path d="M 50 15 Q 75 80 50 145" stroke="#999491" stroke-width="1.5" fill="none" />
    <ellipse cx="50" cy="80" rx="15" ry="25" fill="#1f1d1c" />
    <!-- Chocolate coating splash on lower wheel -->
    <path d="M 15 110 C 30 145, 70 145, 85 110 C 70 155, 30 155, 15 110 Z" fill="#3a1c0d" />
  </g>

  <!-- Axle Rod connecting wheels -->
  <rect x="220" y="172" width="160" height="16" rx="4" fill="#8c7853" stroke="#ffd199" stroke-width="1" />

  <!-- Gloss Sheen on Liquid -->
  <ellipse cx="300" cy="180" rx="120" ry="20" fill="url(#liquidGloss)" />

  <!-- Bottom Label Bar -->
  <rect x="0" y="340" width="600" height="60" fill="#0c0603" opacity="0.8" />
  <text x="30" y="375" font-family="'Bodoni Moda', serif" font-size="18" font-weight="700" fill="#f5ede0">02 / The Granite Conche</text>
  <text x="570" y="375" font-family="'Inter', sans-serif" font-size="12" letter-spacing="2" fill="#d48b46" text-anchor="end">72 HOURS STONE AERATION</text>
</svg>

